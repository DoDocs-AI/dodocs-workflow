name: Validate Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate structure
        run: bash tests/validate-structure.sh

      - name: Validate references
        run: bash tests/validate-references.sh

      - name: Validate version
        run: bash tests/validate-version.sh

      - name: Validate docs
        run: bash tests/validate-docs.sh

      - name: Validate install scripts
        run: bash tests/validate-install.sh

      - name: Validate OpenSpec integration
        run: bash tests/validate-openspec.sh
